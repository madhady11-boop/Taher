name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare iOS project & permissions
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --project-name jumla_market .
          fi
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'نحتاج الوصول للصور لرفع صور منتجات الجملة'" ios/Runner/Info.plist 2>/dev/null || true
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Build iOS app without codesigning
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r JumlaMarket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumlaMarket-IPA
          path: JumlaMarket.ipa
