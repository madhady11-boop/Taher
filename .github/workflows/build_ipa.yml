name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare iOS project & permissions
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --project-name jumla_market .
          fi
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'نحتاج الوصول للصور لرفع صور منتجات الجملة'" ios/Runner/Info.plist 2>/dev/null || true
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Build Runner.app without signing
        run: |
          flutter build ios --release --no-codesign || true
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios_derived -name "Runner.app" -type d | head -n 1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r JumlaMarket.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumlaMarket-IPA
          path: JumlaMarket.ipa
